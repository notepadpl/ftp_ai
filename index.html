<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWASM FTP Genie (Mobile)</title>
    <style>
        body { background: #0d1117; color: #00ffcc; font-family: 'Courier New', Courier, monospace; padding: 10px; margin: 0; }
        h1 { font-size: 1.2em; text-align: center; }
        .box { border: 1px solid #30363d; background: #161b22; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        #terminal-output { background: #010409; color: #7ee787; padding: 8px; height: 200px; overflow-y: auto; border: 1px solid #30363d; font-size: 0.85em; margin-bottom: 10px; white-space: pre-wrap; }
        .input-group { display: flex; gap: 5px; }
        input[type="text"] { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; font-family: monospace; border-radius: 4px; font-size: 1em; }
        button { padding: 10px 15px; background: #238636; color: white; border: none; cursor: pointer; font-family: monospace; border-radius: 4px; font-weight: bold; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>
    <h1>[ FTP Genie (Mobile WASM) ]</h1>
    
    <div class="box">
        <p style="margin: 0; font-size: 0.9em;">Status: <strong id="ai-status" style="color: yellow;">Inicjalizowanie...</strong></p>
    </div>

    <div class="box">
        <div id="terminal-output">Ładowanie środowiska Dżina...<br></div>
        <div class="input-group">
            <input type="text" id="cmd-input" placeholder="Wpisz np. help, list..." onkeydown="if(event.key === 'Enter') runCommand()">
            <button onclick="runCommand()">Wyślij</button>
        </div>
    </div>

    <script>
        function logToTerminal(text, isError = false) {
            const term = document.getElementById('terminal-output');
            term.innerHTML += `<span style="color: ${isError ? '#ff7b72' : '#7ee787'}">> ${text}</span><br>`;
            term.scrollTop = term.scrollHeight;
        }

        function runCommand() {
            const input = document.getElementById('cmd-input');
            const cmd = input.value.trim();
            if (!cmd) return;

            logToTerminal(cmd);
            input.value = "";

            if (typeof Module.ccall === 'function') {
                try {
                    // Wywołanie funkcji z C bezpośrednio z JS
                    const response = Module.ccall('execute_shell_command', 'string', ['string'], [cmd]);
                    logToTerminal(response);
                } catch (e) {
                    logToTerminal("Błąd wykonania w C: " + e, true);
                }
            } else {
                logToTerminal("Moduł C++ nie jest jeszcze gotowy.", true);
            }
        }

        // Konfiguracja jednowątkowa Emscriptena
        var Module = {
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            onRuntimeInitialized: function() {
                document.getElementById('ai-status').innerText = "Gotowy do działania 🧠";
                logToTerminal("🧞 [Dżin]: Środowisko jednowątkowe gotowe!");
            }
        };
    </script>
    <script src="index.js"></script>
</body>
</html>
